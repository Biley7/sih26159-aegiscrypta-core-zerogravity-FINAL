# AegisCrypta frontend server block.
# Copied into /etc/nginx/templates/default.conf.template by the Dockerfile so the
# nginx entrypoint runs envsubst on it; ${AEGIS_API_UPSTREAM} is the only variable
# substituted (nginx runtime variables such as $host and $uri are left intact).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # PCAP uploads can be large
    client_max_body_size 64m;

    # ------------------------------------------------------------------
    # Reverse proxy: the SPA addresses the API with a same-origin relative
    # base URL, so /api is proxied to the backend service. Same-origin means
    # no CORS preflight and no mixed-content failure when this is served
    # behind TLS.
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://${AEGIS_API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # A full scan performs live DNS and TLS probes; allow it to finish.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Backend-owned endpoints the UI links to or polls directly.
    location = /health {
        proxy_pass http://${AEGIS_API_UPSTREAM}/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://${AEGIS_API_UPSTREAM}/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /redoc {
        proxy_pass http://${AEGIS_API_UPSTREAM}/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://${AEGIS_API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # Static assets: content-hashed filenames, safe to cache forever.
    # ------------------------------------------------------------------
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ------------------------------------------------------------------
    # SPA fallback: client-side routes resolve to index.html instead of 404.
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
